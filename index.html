<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Space: Sector Protocol</title>

  <!-- Anti-caching headers for development and instant reload -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preload" href="/fonts/GeistPixel-Line.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="game-container"></div>

  <!-- Atmospheric Post-Processing Overlays -->
  <div class="crt-overlay"></div>
  <div class="vignette-overlay"></div>
  <div id="damage-flash" class="damage-flash"></div>

  <!-- Zero-HUD: only the aim reticle and the pickup/status toast remain on screen.
       Health, stasis and ammo are diegetic (on Isaac); everything else lives in the inventory. -->
  <div id="hud">
    <div id="crosshair" class="crosshair-hidden">
      <div class="plasma-bracket left"></div>
      <div class="plasma-dot"></div>
      <div class="plasma-bracket right"></div>
    </div>

    <div id="pickup-toast" class="pickup-toast-hidden" role="status" aria-live="polite"></div>
  </div>

  <!-- Holographic inventory (Tab) — built by src/ui/HoloInventory.ts -->
  <div id="holo-inventory"></div>

  <!-- Holographic stacked 3D menu (main / pause / end) — built by src/ui/HoloMenu.ts -->
  <div id="holo-menu" class="holo-menu"></div>

  <!-- Module Logic -->
  <script type="module" src="game.ts"></script>
</body>
</html>
